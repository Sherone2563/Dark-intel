
[project]
name = "dark-intel"
version = "0.1.0"
description = "Evidence-backed threat intelligence and entity resolution for authorized research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.setuptools]
packages = []
